[workspace]
resolver = "2"
members = [
    "crates/common",
    "crates/downloader",
    "crates/packager",
    "crates/installer-runtime",
    "crates/installer-shell",
    "crates/server-deploy",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
semver = { version = "1", features = ["serde"] }
sha2 = "0.10"
anyhow = "1"
thiserror = "2"
